<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>沿路美食搜尋</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="detour-bites" />
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

<div class="mobile-view-tabs" id="mobileViewTabs">
  <button type="button" class="mobile-view-tab active" data-view="list">📋 清單</button>
  <button type="button" class="mobile-view-tab" data-view="map">🗺️ 地圖</button>
</div>

<div class="app" id="appEl">
  <div class="sidebar">
    <header>
      <h1>沿路美食搜尋</h1>
      <div class="tagline">找附近的餐廳，或填目的地找順路的</div>
    </header>

    <label for="origin">起點</label>
    <div class="input-with-button">
      <div class="autocomplete-wrap">
        <input id="origin" type="text" placeholder="例如：台北車站" autocomplete="off" />
        <div id="originSuggestions" class="autocomplete-list" hidden></div>
      </div>
      <button type="button" id="useCurrentLocationBtn" class="secondary-btn">目前位置</button>
    </div>

    <label for="destination">目的地（找順路餐廳才需要）</label>
    <div class="autocomplete-wrap">
      <input id="destination" type="text" placeholder="例如：台中高鐵站" autocomplete="off" />
      <div id="destinationSuggestions" class="autocomplete-list" hidden></div>
    </div>

    <label for="keyword">想吃什麼（選填）</label>
    <input id="keyword" type="text" placeholder="例如：拉麵，或口語像「便宜、現在有開」" />

    <details class="advanced-options" id="advancedOptions">
      <summary>更多條件</summary>
      <div class="row2">
        <div>
          <label for="targetCount">找幾間</label>
          <input id="targetCount" type="number" value="10" min="1" max="50" step="1" />
        </div>
        <div>
          <label for="radius">搜尋半徑 (m)</label>
          <input id="radius" type="number" value="1200" min="100" step="100" />
        </div>
      </div>

      <label for="dishKeyword">評論要提到的餐點</label>
      <input id="dishKeyword" type="text" placeholder="例如：小籠包、辣味" />
      <div class="key-note">只留下 Google 評論裡有人提到的店家；會多查每間店的評論，比較慢。</div>
    </details>

    <div class="search-actions">
      <button type="button" id="nearbyBtn">📍 附近吃什麼</button>
      <button type="button" id="searchBtn">🚗 順路吃什麼</button>
    </div>
    <div id="status" class="status"></div>
    <div id="routeOptions" class="route-options" hidden></div>

    <div class="divider"></div>

    <button type="button" id="manageEatenBtn" class="manage-eaten-btn secondary-btn">📋 管理吃過清單</button>

    <div class="results">
      <h2>搜尋結果</h2>
      <div id="discoverBox" class="discover-box" hidden>
        <div class="discover-title">🎲 踩新點</div>
        <div class="discover-sub">不知道吃什麼？從這次結果隨機挑一間還沒吃過的。</div>
        <label class="checkbox-label">
          <input type="checkbox" id="includeEatenCheckbox" />
          包含吃過的高評價餐廳（4★以上）
        </label>
        <button type="button" id="discoverBtn" class="discover-btn">🎲 隨機挑一間</button>
        <div id="discoverResult"></div>
      </div>
      <div id="resultsControls" class="results-controls" hidden>
        <select id="sortSelect">
          <option id="sortDistanceOption" value="distance">順路優先</option>
          <option value="rating">評分高到低</option>
          <option value="price">價格低到高</option>
        </select>
        <label class="checkbox-label">
          <input type="checkbox" id="openNowOnly" />
          只顯示營業中
        </label>
      </div>
      <div id="resultCount" class="count">尚未搜尋</div>
      <div id="resultList"></div>
    </div>
  </div>

  <div class="main">
    <div class="map-hint" id="mapHint">按下搜尋，地圖會顯示在這裡。</div>
    <div id="map"></div>
  </div>
</div>

<div id="eatenModalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="eatenModalTitle">
    <div class="modal-header">
      <h3 id="eatenModalTitle">吃過清單</h3>
      <button type="button" id="closeEatenModalBtn" class="modal-close" aria-label="關閉">✕</button>
    </div>
    <div class="modal-toolbar">
      <button type="button" id="exportEatenBtn" class="secondary-btn">⬇️ 匯出 JSON</button>
      <label class="secondary-btn modal-import-label">
        ⬆️ 匯入 JSON
        <input type="file" id="importEatenInput" accept="application/json" hidden />
      </label>
    </div>
    <div id="eatenModalStatus" class="modal-status" hidden></div>
    <div id="eatenListEl" class="eaten-list"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
