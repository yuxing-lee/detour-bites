<script type="module">
  import { MarkerClusterer, SuperClusterAlgorithm } from '@googlemaps/markerclusterer';

  const GOOGLE_MAPS_API_KEY = import.meta.env.VITE_GOOGLE_MAPS_API_KEY;
  const GEMINI_API_KEY = import.meta.env.VITE_GEMINI_API_KEY;
  // 依序嘗試的 model 清單：每個 model 在 Google 那邊是各自獨立的免費額度，
  // 前面的 model 額度用完（或暫時出錯）就自動換下一個，盡量把整體可用額度疊加起來。
  // gemma 系列跟 Gemini 系列的免費配額是分開算的，所以放在清單最後面當保底。
  const GEMINI_MODEL_CHAIN = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemma-3-27b-it'];
  const SAMPLE_INTERVAL_KM = 8;
  const MAX_REVIEW_CANDIDATES = 60;
  // 點卡片/marker 開 InfoWindow 時會強制 zoom 到這個層級（見 panForInfoWindow），
  // clusterer 的 maxZoom 必須小於這個值，不然開窗當下那顆 marker 還可能被收進 cluster
  // 隱藏掉，變成 InfoWindow 指著一顆數字圓點而不是實際的店家 marker
  const PLACE_INFO_ZOOM = 15;
  const CLUSTER_MAX_ZOOM = PLACE_INFO_ZOOM - 1;

  let map, directionsService, directionsRenderer;
  let activeInfoWindow = null;
  let placeMarkers = [];
  let placeMarkerCluster = null;
  let placeCards = [];
  let sdkLoaded = false;
  let sdkLoadPromise = null;
  let allRoutes = [];
  let selectedRouteIndex = 0;
  let lastResults = [];
  let lastOrigin = '';
  let lastDestination = '';
  let lastOriginLocation = null; // 沒填目的地時，搜尋中心點（起點的經緯度）

  const statusEl = document.getElementById('status');
  const resultCountEl = document.getElementById('resultCount');
  const resultListEl = document.getElementById('resultList');
  const mapHintEl = document.getElementById('mapHint');
  const appEl = document.getElementById('appEl');
  const mobileViewTabsEl = document.getElementById('mobileViewTabs');
  const searchBtn = document.getElementById('searchBtn');
  const originInput = document.getElementById('origin');
  const destinationInput = document.getElementById('destination');
  const targetCountInput = document.getElementById('targetCount');
  const radiusInput = document.getElementById('radius');
  const keywordInput = document.getElementById('keyword');
  const keywordParseBtn = document.getElementById('keywordParseBtn');
  const dishKeywordInput = document.getElementById('dishKeyword');
  const useCurrentLocationBtn = document.getElementById('useCurrentLocationBtn');
  const originSuggestionsEl = document.getElementById('originSuggestions');
  const destinationSuggestionsEl = document.getElementById('destinationSuggestions');
  const routeOptionsEl = document.getElementById('routeOptions');
  const resultsControlsEl = document.getElementById('resultsControls');
  const sortSelectEl = document.getElementById('sortSelect');
  const sortDistanceOptionEl = document.getElementById('sortDistanceOption');
  const openNowOnlyEl = document.getElementById('openNowOnly');
  const discoverBoxEl = document.getElementById('discoverBox');
  const discoverBtn = document.getElementById('discoverBtn');
  const includeEatenCheckbox = document.getElementById('includeEatenCheckbox');
  const discoverResultEl = document.getElementById('discoverResult');
  const manageEatenBtn = document.getElementById('manageEatenBtn');
  const eatenModalOverlayEl = document.getElementById('eatenModalOverlay');
  const closeEatenModalBtn = document.getElementById('closeEatenModalBtn');
  const eatenListEl = document.getElementById('eatenListEl');
  const eatenModalStatusEl = document.getElementById('eatenModalStatus');
  const exportEatenBtn = document.getElementById('exportEatenBtn');
  const importEatenInput = document.getElementById('importEatenInput');

  const SEARCH_STORAGE_KEY = 'detour-bites:lastSearch';
  const EATEN_STORAGE_KEY = 'detour-bites:eatenPlaces';

  // 「吃過」清單存 { name, rating }：rating 是 1~5 顆星，0/undefined 代表吃過但還沒評分
  function loadEatenPlaces() {
    try {
      const raw = localStorage.getItem(EATEN_STORAGE_KEY);
      if (!raw) return new Map();
      const arr = JSON.parse(raw);
      return new Map(arr.map(item => [item.id, { name: item.name, rating: item.rating || 0 }]));
    } catch (err) {
      console.warn('讀取已吃過清單失敗：', err);
      return new Map();
    }
  }

  function saveEatenPlaces() {
    try {
      localStorage.setItem(EATEN_STORAGE_KEY, JSON.stringify(
        Array.from(eatenPlaces, ([id, entry]) => ({ id, name: entry.name, rating: entry.rating }))
      ));
    } catch (err) {
      console.warn('儲存已吃過清單失敗：', err);
    }
  }

  let eatenPlaces = loadEatenPlaces();

  function isEaten(id) {
    return eatenPlaces.has(id);
  }

  function eatenRating(id) {
    return eatenPlaces.get(id)?.rating || 0;
  }

  function setEatenRating(id, name, rating) {
    eatenPlaces.set(id, { name, rating });
    saveEatenPlaces();
    updateManageEatenBtnLabel();
  }

  function clearEaten(id) {
    eatenPlaces.delete(id);
    saveEatenPlaces();
    updateManageEatenBtnLabel();
  }

  function updateManageEatenBtnLabel() {
    manageEatenBtn.textContent = `📋 管理吃過清單（${eatenPlaces.size}）`;
  }

  updateManageEatenBtnLabel();

  function starRatingHTML(id) {
    const rating = eatenRating(id);
    return [1, 2, 3, 4, 5].map(n => `<button type="button" class="star-btn${n <= rating ? ' filled' : ''}" data-value="${n}" aria-label="${n} 顆星">${n <= rating ? '★' : '☆'}</button>`).join('');
  }

  function eatenLabelText(id) {
    const rating = eatenRating(id);
    return rating ? `已吃過（${rating}★）` : (isEaten(id) ? '已吃過（尚未評分）' : '標記已吃過：');
  }

  function eatenWidgetHTML(id) {
    return `
      <div class="eaten-widget">
        <span class="eaten-label">${eatenLabelText(id)}</span>
        <span class="star-picker">${starRatingHTML(id)}</span>
        ${isEaten(id) ? '<button type="button" class="clear-eaten-btn" title="取消標記已吃過">✕</button>' : ''}
      </div>
    `;
  }

  // 掛在 slotEl 底下渲染星星評分小工具並綁定事件；點星星＝標記已吃過＋設定評分，點 ✕＝取消標記
  // onChange 是選填的額外回呼，給需要在評分變動後重繪外層清單的呼叫端（例如管理清單）用
  function wireEatenWidget(slotEl, id, name, onChange) {
    slotEl.innerHTML = eatenWidgetHTML(id);
    slotEl.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setEatenRating(id, name, parseInt(btn.dataset.value, 10));
        wireEatenWidget(slotEl, id, name, onChange);
        if (onChange) onChange();
      });
    });
    const clearBtn = slotEl.querySelector('.clear-eaten-btn');
    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearEaten(id);
        wireEatenWidget(slotEl, id, name, onChange);
        if (onChange) onChange();
      });
    }
  }

  function setEatenModalStatus(msg, kind) {
    eatenModalStatusEl.textContent = msg || '';
    eatenModalStatusEl.className = 'modal-status' + (kind ? ' ' + kind : '');
    eatenModalStatusEl.hidden = !msg;
  }

  // 「管理吃過清單」彈窗：列出所有標記過的餐廳，可直接改評分或清除，
  // 不受目前搜尋結果限制（就算這次路線沒經過那間店，也能在這裡補評分）
  function renderEatenList() {
    const entries = Array.from(eatenPlaces.entries());
    eatenListEl.innerHTML = '';

    if (!entries.length) {
      eatenListEl.innerHTML = '<div class="review-empty">目前沒有標記任何已吃過的餐廳，在餐廳卡片上點星星就可以加入。</div>';
      return;
    }

    entries.sort((a, b) => (b[1].rating || 0) - (a[1].rating || 0) || (a[1].name || '').localeCompare(b[1].name || '', 'zh-Hant'));

    entries.forEach(([id, entry]) => {
      const item = document.createElement('div');
      item.className = 'eaten-list-item';

      const nameEl = document.createElement('div');
      nameEl.className = 'eaten-list-name';
      nameEl.textContent = entry.name || '(未命名)';

      const slot = document.createElement('div');
      slot.className = 'eaten-widget-slot';

      item.appendChild(nameEl);
      item.appendChild(slot);
      eatenListEl.appendChild(item);

      wireEatenWidget(slot, id, entry.name, renderEatenList);
    });
  }

  function openEatenModal() {
    setEatenModalStatus('');
    renderEatenList();
    eatenModalOverlayEl.hidden = false;
  }

  function closeEatenModal() {
    eatenModalOverlayEl.hidden = true;
  }

  manageEatenBtn.addEventListener('click', openEatenModal);
  closeEatenModalBtn.addEventListener('click', closeEatenModal);
  eatenModalOverlayEl.addEventListener('click', (e) => {
    if (e.target === eatenModalOverlayEl) closeEatenModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !eatenModalOverlayEl.hidden) closeEatenModal();
  });

  exportEatenBtn.addEventListener('click', () => {
    const data = Array.from(eatenPlaces, ([id, entry]) => ({ id, name: entry.name, rating: entry.rating }));
    if (!data.length) {
      setEatenModalStatus('目前沒有資料可以匯出', 'error');
      return;
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `detour-bites-eaten-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setEatenModalStatus(`已匯出 ${data.length} 筆資料`, 'ok');
  });

  importEatenInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const arr = JSON.parse(text);
      if (!Array.isArray(arr)) throw new Error('內容不是陣列');

      let imported = 0;
      arr.forEach(item => {
        if (!item || typeof item.id !== 'string' || !item.id) return;
        const rating = Math.max(0, Math.min(5, Math.round(Number(item.rating)) || 0));
        eatenPlaces.set(item.id, { name: typeof item.name === 'string' ? item.name : '', rating });
        imported++;
      });

      saveEatenPlaces();
      updateManageEatenBtnLabel();
      renderEatenList();
      setEatenModalStatus(`已匯入 ${imported} 筆吃過清單資料`, 'ok');
    } catch (err) {
      console.warn('匯入吃過清單失敗：', err);
      setEatenModalStatus('匯入失敗，請確認檔案是先前用「匯出」產生的 JSON', 'error');
    } finally {
      importEatenInput.value = '';
    }
  });

  const EATEN_GOOD_RATING_THRESHOLD = 4;
  // 勾選「包含吃過的高評價餐廳」時，固定有這個比例的機率會從舊愛裡抽，其餘機率抽新店，
  // 不受這次搜尋路線上剛好有幾間舊餐廳影響（避免路線上舊愛一多就蓋過新店機會，或一間都沒有時 checkbox 形同虛設）
  const OLD_FAVORITE_RATIO = 0.25;

  // 同一個池子（舊愛池或新店池）內部要抽哪一間時用的權重：
  // 沒吃過＝基準權重 1；吃過且評分 4★／5★ 時，每多一顆星機率翻倍（2^(星星-3)）；
  // 吃過但評分 3★ 以下（含尚未評分）一律不列入隨機清單
  function placeWeight(p) {
    if (!isEaten(p.id)) return 1;
    const rating = eatenRating(p.id);
    if (rating < EATEN_GOOD_RATING_THRESHOLD) return 0;
    return Math.pow(2, rating - 3);
  }

  function weightedRandomPick(pool) {
    const weights = pool.map(placeWeight);
    const total = weights.reduce((sum, w) => sum + w, 0);
    if (total <= 0) return null;
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function loadSavedSearch() {
    try {
      const raw = localStorage.getItem(SEARCH_STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.origin) originInput.value = saved.origin;
      if (saved.destination) destinationInput.value = saved.destination;
      if (saved.targetCount) targetCountInput.value = saved.targetCount;
      if (saved.radius) radiusInput.value = saved.radius;
      if (saved.keyword) keywordInput.value = saved.keyword;
      if (saved.dishKeyword) dishKeywordInput.value = saved.dishKeyword;
    } catch (err) {
      console.warn('讀取上次搜尋條件失敗：', err);
    }
  }

  function saveSearch() {
    try {
      localStorage.setItem(SEARCH_STORAGE_KEY, JSON.stringify({
        origin: originInput.value.trim(),
        destination: destinationInput.value.trim(),
        targetCount: targetCountInput.value,
        radius: radiusInput.value,
        keyword: keywordInput.value.trim(),
        dishKeyword: dishKeywordInput.value.trim()
      }));
    } catch (err) {
      console.warn('儲存搜尋條件失敗：', err);
    }
  }

  loadSavedSearch();

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  if (!GOOGLE_MAPS_API_KEY) {
    setStatus('尚未設定 Google Maps API Key，請在 .env 中設定 VITE_GOOGLE_MAPS_API_KEY 後重新啟動 npm run dev', 'error');
    searchBtn.disabled = true;
  }

  useCurrentLocationBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      setStatus('這個瀏覽器不支援定位功能', 'error');
      return;
    }
    useCurrentLocationBtn.disabled = true;
    useCurrentLocationBtn.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        originInput.value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        useCurrentLocationBtn.disabled = false;
        useCurrentLocationBtn.textContent = '目前位置';
        setStatus('已取得目前位置', 'ok');
      },
      (err) => {
        useCurrentLocationBtn.disabled = false;
        useCurrentLocationBtn.textContent = '目前位置';
        setStatus('無法取得目前位置：' + err.message, 'error');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  function loadGoogleMapsSDK() {
    // 快取「載入中」的 Promise，讓打字觸發的自動完成跟按下搜尋兩邊同時呼叫時
    // 不會因為腳本還沒載完、sdkLoaded 還是 false，就各自插入重複的 <script>
    if (sdkLoadPromise) return sdkLoadPromise;
    sdkLoadPromise = new Promise((resolve, reject) => {
      window.__gmapsInit = () => {
        sdkLoaded = true;
        resolve();
      };
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=geometry,places&callback=__gmapsInit`;
      script.onerror = () => {
        sdkLoadPromise = null;
        reject(new Error('Google Maps SDK 載入失敗，請確認 API key 是否正確、且已啟用 Maps JavaScript API / Directions API'));
      };
      document.head.appendChild(script);
    });
    return sdkLoadPromise;
  }

  function debounce(fn, delay) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  // 用 AutocompleteSuggestion（新版 Places API，取代已對新客戶停用的 google.maps.places.Autocomplete）
  // 自己畫下拉選單，這樣才能套用暗色主題、也不影響「目前位置」直接寫入座標字串的既有邏輯
  function setupAutocomplete(inputEl, listEl) {
    let sessionToken = null;
    let currentSuggestions = [];
    let activeIndex = -1;

    function hideList() {
      listEl.hidden = true;
      listEl.innerHTML = '';
      currentSuggestions = [];
      activeIndex = -1;
    }

    function updateActive() {
      Array.from(listEl.children).forEach((el, i) => {
        el.classList.toggle('active', i === activeIndex);
      });
    }

    function selectSuggestion(prediction) {
      inputEl.value = prediction.text?.text || '';
      hideList();
      sessionToken = null; // 選完這次搜尋就結束，下次輸入會開新的 session
    }

    function renderList(suggestions) {
      currentSuggestions = suggestions;
      activeIndex = -1;
      listEl.innerHTML = '';

      if (!suggestions.length) {
        hideList();
        return;
      }

      suggestions.forEach((s) => {
        const prediction = s.placePrediction;
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        const main = prediction.mainText?.text || prediction.text?.text || '';
        const secondary = prediction.secondaryText?.text || '';
        item.innerHTML = `
          <div class="main">${escapeHtml(main)}</div>
          ${secondary ? `<div class="secondary">${escapeHtml(secondary)}</div>` : ''}
        `;
        // 用 mousedown 而不是 click，才能搶在 input 的 blur 事件把清單關掉之前完成選取
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectSuggestion(prediction);
        });
        listEl.appendChild(item);
      });

      listEl.hidden = false;
    }

    const fetchSuggestions = debounce(async (value) => {
      if (!value) {
        hideList();
        return;
      }
      try {
        await loadGoogleMapsSDK();
        if (!sessionToken) sessionToken = new google.maps.places.AutocompleteSessionToken();
        const { suggestions } = await google.maps.places.AutocompleteSuggestion.fetchAutocompleteSuggestions({
          input: value,
          language: 'zh-TW',
          sessionToken
        });
        renderList(suggestions || []);
      } catch (err) {
        console.warn('地址建議載入失敗：', err);
        hideList();
      }
    }, 300);

    inputEl.addEventListener('input', () => {
      if (!GOOGLE_MAPS_API_KEY) return;
      fetchSuggestions(inputEl.value.trim());
    });

    inputEl.addEventListener('blur', () => {
      // 延遲一下，讓上面 mousedown 選取的邏輯先跑完，不然清單會在選取前就被關掉
      setTimeout(hideList, 150);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (listEl.hidden || !currentSuggestions.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, currentSuggestions.length - 1);
        updateActive();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        updateActive();
      } else if (e.key === 'Enter') {
        if (activeIndex >= 0) {
          e.preventDefault();
          selectSuggestion(currentSuggestions[activeIndex].placePrediction);
        }
      } else if (e.key === 'Escape') {
        hideList();
      }
    });
  }

  setupAutocomplete(originInput, originSuggestionsEl);
  setupAutocomplete(destinationInput, destinationSuggestionsEl);

  function initMapIfNeeded() {
    if (map) return;
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 25.0478, lng: 121.5171 },
      zoom: 8,
      disableDefaultUI: false,
      styles: [
        { elementType: 'geometry', stylers: [{ color: '#1b2140' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#9aa3c7' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#12172b' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2a3355' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0f1428' }] },
        { featureType: 'poi', stylers: [{ visibility: 'off' }] }
      ]
    });
    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({
      map,
      suppressMarkers: false,
      polylineOptions: { strokeColor: '#f2a340', strokeWeight: 5 }
    });
    mapHintEl.style.display = 'none';
  }

  // 手機版「清單／地圖」頁籤：桌機版兩欄並排看不到這排按鈕，切換邏輯不會影響桌機
  let mobileView = 'list';

  function setMobileView(view) {
    mobileView = view;
    appEl.classList.toggle('mobile-view-map', view === 'map');
    mobileViewTabsEl.querySelectorAll('.mobile-view-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === view);
    });
    if (view !== 'map' || !map) return;
    // 地圖容器切換前是 display:none（寬高是 0），搜尋時算出來的置中/縮放都是在那個狀態下算的，
    // 所以切回地圖頁籤時不能只靠 resize，要用已知的路線邊界／起點座標重新套用一次，
    // 不然畫面可能整片灰掉，或停在容器還是 0 大小時算出來的錯誤縮放層級
    google.maps.event.trigger(map, 'resize');
    if (allRoutes.length && allRoutes[selectedRouteIndex]) {
      map.fitBounds(allRoutes[selectedRouteIndex].bounds);
    } else if (lastOriginLocation) {
      map.setCenter(lastOriginLocation);
      map.setZoom(15);
    }
  }

  mobileViewTabsEl.querySelectorAll('.mobile-view-tab').forEach(btn => {
    btn.addEventListener('click', () => setMobileView(btn.dataset.view));
  });

  // 把「起點」文字轉成經緯度：目前位置按鈕填入的是 "lat,lng" 字串可以直接解析，
  // 其他地址文字則交給 Geocoder 轉換
  async function resolveLocationText(text) {
    const coordMatch = text.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (coordMatch) {
      return new google.maps.LatLng(parseFloat(coordMatch[1]), parseFloat(coordMatch[2]));
    }
    const geocoder = new google.maps.Geocoder();
    const { results } = await geocoder.geocode({ address: text, language: 'zh-TW' });
    if (!results.length) throw new Error('找不到這個地點：' + text);
    return results[0].geometry.location;
  }

  function clearPlaceMarkers() {
    if (placeMarkerCluster) {
      placeMarkerCluster.clearMarkers();
      placeMarkerCluster = null;
    }
    placeMarkers.forEach(m => m.setMap(null));
    placeMarkers = [];
    placeCards = [];
    if (activeInfoWindow) {
      activeInfoWindow.close();
      activeInfoWindow = null;
    }
  }

  // 清單編號跟地圖標記共用同一套外觀邏輯：預設是帶數字的橘色小圓點，
  // 滑鼠移到清單卡片或地圖標記其中一邊時，兩邊會一起放大變色，讓使用者看得出兩者對應同一間店
  function markerIcon(highlighted) {
    return {
      path: google.maps.SymbolPath.CIRCLE,
      scale: highlighted ? 13 : 9,
      fillColor: highlighted ? '#ffb85c' : '#f2a340',
      fillOpacity: 1,
      strokeColor: '#12172b',
      strokeWeight: highlighted ? 2.5 : 1.5
    };
  }

  function markerLabel(index) {
    return { text: String(index + 1), color: '#12172b', fontSize: '11px', fontWeight: '700' };
  }

  function setPlaceHighlighted(index, isOn) {
    const marker = placeMarkers[index];
    const card = placeCards[index];
    if (marker) marker.setIcon(markerIcon(isOn));
    if (card) card.classList.toggle('highlighted', isOn);
  }

  function summarizeRoute(route) {
    let distanceMeters = 0;
    let durationSeconds = 0;
    route.legs.forEach(leg => {
      distanceMeters += leg.distance ? leg.distance.value : 0;
      durationSeconds += leg.duration ? leg.duration.value : 0;
    });
    const km = (distanceMeters / 1000).toFixed(1);
    const mins = Math.round(durationSeconds / 60);
    const hours = Math.floor(mins / 60);
    const remMins = mins % 60;
    const durationText = hours > 0 ? `${hours} 小時 ${remMins} 分` : `${mins} 分`;
    return `${km} 公里・約 ${durationText}`;
  }

  function renderRouteOptions() {
    routeOptionsEl.innerHTML = '';
    const routes = allRoutes.slice(0, 3);

    routes.forEach((route, i) => {
      const card = document.createElement('label');
      card.className = 'route-option' + (i === selectedRouteIndex ? ' selected' : '');
      card.innerHTML = `
        <input type="radio" name="routeChoice" value="${i}" ${i === selectedRouteIndex ? 'checked' : ''} />
        <div>
          <div class="route-option-title">路線 ${i + 1}${route.summary ? '：' + escapeHtml(route.summary) : ''}</div>
          <div class="route-option-meta">${summarizeRoute(route)}</div>
        </div>
      `;
      card.querySelector('input').addEventListener('change', () => selectRoute(i));
      routeOptionsEl.appendChild(card);
    });

    routeOptionsEl.hidden = routes.length === 0;
  }

  async function selectRoute(index) {
    selectedRouteIndex = index;
    directionsRenderer.setRouteIndex(index);
    renderRouteOptions();
    await searchAlongRoute(index);
  }

  // 沿路徑每隔 intervalKm 公里取一個採樣點
  function samplePointsAlongPath(path, intervalKm) {
    const points = [];
    let accumulated = 0;
    points.push(path[0]);
    for (let i = 1; i < path.length; i++) {
      const segDist = google.maps.geometry.spherical.computeDistanceBetween(path[i - 1], path[i]) / 1000;
      accumulated += segDist;
      if (accumulated >= intervalKm) {
        points.push(path[i]);
        accumulated = 0;
      }
    }
    const last = path[path.length - 1];
    if (points[points.length - 1] !== last) points.push(last);
    return points;
  }

  // 把路線每個 leg 的每個 step 的詳細座標串成一條完整、有方向性的路徑
  // （比 overview_path 精細很多，而且只包含「你會實際開的那個方向的車道」，
  // 不會混到對向車道或平行道路）
  function buildDetailedRoutePath(route) {
    const points = [];
    (route.legs || []).forEach(leg => {
      (leg.steps || []).forEach(step => {
        const stepPath = step.path && step.path.length ? step.path : [step.start_location, step.end_location];
        stepPath.forEach(pt => {
          const last = points[points.length - 1];
          if (!last || !last.equals(pt)) points.push(pt);
        });
      });
    });
    return points.length >= 2 ? points : route.overview_path;
  }

  function normalizeAngleRad(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }

  const EARTH_RADIUS_M = 6371000;

  // 把點 P 投影到路線上的一個線段 A→B，回傳「垂直於路線的距離」與
  // 「沿路線方向、從路線起點累積到投影點的距離」。
  // 用球面三角的 cross-track / along-track 公式，短線段（一個 step 內的路徑點）誤差可忽略。
  function projectPointOntoSegment(A, B, P, cumulativeToA, segLen) {
    const headingAB = google.maps.geometry.spherical.computeHeading(A, B);
    const distAP = google.maps.geometry.spherical.computeDistanceBetween(A, P);

    if (distAP < 0.5 || segLen < 0.5) {
      return { distance: distAP, progress: cumulativeToA };
    }

    const bearingAB = (headingAB * Math.PI) / 180;
    const bearingAP = (google.maps.geometry.spherical.computeHeading(A, P) * Math.PI) / 180;
    const dr = distAP / EARTH_RADIUS_M;
    const bearingDiff = normalizeAngleRad(bearingAP - bearingAB);

    const crossTrack = Math.asin(Math.sin(dr) * Math.sin(bearingDiff)) * EARTH_RADIUS_M;
    let alongTrackRatio = Math.cos(dr) / Math.cos(crossTrack / EARTH_RADIUS_M);
    alongTrackRatio = Math.max(-1, Math.min(1, alongTrackRatio));
    let alongTrack = Math.acos(alongTrackRatio) * EARTH_RADIUS_M;
    if (Number.isNaN(alongTrack)) alongTrack = 0;
    if (Math.abs(bearingDiff) > Math.PI / 2) alongTrack = -alongTrack;

    if (alongTrack <= 0) {
      return { distance: distAP, progress: cumulativeToA };
    }
    if (alongTrack >= segLen) {
      const distBP = google.maps.geometry.spherical.computeDistanceBetween(B, P);
      return { distance: distBP, progress: cumulativeToA + segLen };
    }
    return { distance: Math.abs(crossTrack), progress: cumulativeToA + alongTrack };
  }

  // 找出點 P 到整條路線最近的位置：真正垂直於路線的距離（順路程度），
  // 以及沿路線方向從起點累積到那個位置的距離（用來確保排序不會忽前忽後）。
  // 因為是用有方向性的逐步路徑計算，天生就不會把對向車道/反方向路段誤判成「順路」。
  function projectPointOntoRoutePath(point, path) {
    let cumulative = 0;
    let best = null;
    for (let i = 1; i < path.length; i++) {
      const A = path[i - 1];
      const B = path[i];
      const segLen = google.maps.geometry.spherical.computeDistanceBetween(A, B);
      if (segLen > 0) {
        const result = projectPointOntoSegment(A, B, point, cumulative, segLen);
        if (!best || result.distance < best.distance) best = result;
      }
      cumulative += segLen;
    }
    if (!best) {
      const only = path[0];
      return { distance: google.maps.geometry.spherical.computeDistanceBetween(only, point), progress: 0 };
    }
    return best;
  }

  const PLACE_FIELD_MASK = [
    'places.id',
    'places.displayName',
    'places.formattedAddress',
    'places.location',
    'places.rating',
    'places.userRatingCount',
    'places.priceLevel',
    'places.priceRange',
    'places.currentOpeningHours.openNow',
    'places.websiteUri'
  ].join(',');

  // 有填關鍵字時：改用 Text Search (New)，比對更接近 Google Maps 打字搜尋的語意/相關性
  // locationBias 只是「軟性」偏好、不是硬性邊界，所以另外用實際距離過濾回半徑內
  async function textSearch(location, radius, keyword) {
    const body = {
      textQuery: keyword,
      includedType: 'restaurant',
      maxResultCount: 20,
      locationBias: {
        circle: {
          center: { latitude: location.lat(), longitude: location.lng() },
          radius: radius
        }
      },
      rankPreference: 'DISTANCE',
      languageCode: 'zh-TW'
    };

    try {
      const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': PLACE_FIELD_MASK
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        console.warn('searchText 回傳非 OK：', res.status, errText);
        return [];
      }

      const data = await res.json();
      const places = data.places || [];

      return places.filter(p => {
        if (!p.location) return false;
        const dist = google.maps.geometry.spherical.computeDistanceBetween(
          location,
          new google.maps.LatLng(p.location.latitude, p.location.longitude)
        );
        return dist <= radius;
      });
    } catch (err) {
      console.warn('searchText 發生錯誤：', err);
      return [];
    }
  }

  // 沒填關鍵字時：單純找附近餐廳，用 searchNearby 的硬性半徑限制
  async function nearbySearch(location, radius, keyword) {
    if (keyword) return textSearch(location, radius, keyword);

    const body = {
      includedTypes: ['restaurant'],
      maxResultCount: 20,
      locationRestriction: {
        circle: {
          center: { latitude: location.lat(), longitude: location.lng() },
          radius: radius
        }
      },
      rankPreference: 'POPULARITY',
      languageCode: 'zh-TW'
    };

    try {
      const res = await fetch('https://places.googleapis.com/v1/places:searchNearby', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': PLACE_FIELD_MASK
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        console.warn('searchNearby 回傳非 OK：', res.status, errText);
        return [];
      }

      const data = await res.json();
      return data.places || [];
    } catch (err) {
      console.warn('searchNearby 發生錯誤：', err);
      return [];
    }
  }

  const PRICE_LABELS = {
    PRICE_LEVEL_INEXPENSIVE: '$',
    PRICE_LEVEL_MODERATE: '$$',
    PRICE_LEVEL_EXPENSIVE: '$$$',
    PRICE_LEVEL_VERY_EXPENSIVE: '$$$$'
  };

  // priceLevel（$/$$/$$$/$$$$ 等級）在很多店家（尤其台灣的店）都沒有資料，
  // 但新版 Places API 另外提供 priceRange（實際金額區間），有資料時可以拿來當備援顯示
  function formatMoney(money) {
    if (!money || money.units == null) return '';
    const amount = Number(money.units);
    if (Number.isNaN(amount)) return '';
    return `${money.currencyCode || ''}${amount}`;
  }

  function formatPriceRange(priceRange) {
    if (!priceRange) return '';
    const start = formatMoney(priceRange.startPrice);
    const end = formatMoney(priceRange.endPrice);
    if (start && end) return `${start} - ${end}`;
    if (start) return `${start} 起`;
    if (end) return `${end} 以下`;
    return '';
  }

  function priceText(p) {
    return PRICE_LABELS[p.priceLevel] || formatPriceRange(p.priceRange);
  }

  // 帶原本的起點/終點，把這間店當中途停靠點，開起來是一條完整的「起點→餐廳→目的地」路線；
  // 沒填目的地時就直接導航去這間店，不需要中途停靠點
  // 注意：waypoints 參數不支援 place_id: 前綴（實測會被當成純文字搜尋，顯示「找不到」），只能用經緯度
  function buildNavUrl(pos) {
    const base = `https://www.google.com/maps/dir/?api=1`
      + `&origin=${encodeURIComponent(lastOrigin)}`
      + `&travelmode=driving`;
    return lastDestination
      ? base
        + `&destination=${encodeURIComponent(lastDestination)}`
        + `&waypoints=${encodeURIComponent(`${pos.lat},${pos.lng}`)}`
      : base + `&destination=${encodeURIComponent(`${pos.lat},${pos.lng}`)}`;
  }

  // websiteUri 常見的網域是這些線上訂位平台本身（餐廳沒自架官網、直接把訂位頁當「網站」登記），
  // 這種情況可以比對網域先告訴使用者「這是訂位連結」；比對不到的話沒辦法知道網址底下有沒有訂位頁面
  // （例如官網自己架、藏在某個子頁面），只能顯示中性的「官方網站」讓使用者自己找
  const RESERVATION_PLATFORM_DOMAINS = [
    'inline.app',
    'eztable.com',
    'tablecheck.com',
    'opentable.com',
    'resy.com',
    'quandoo.com',
    'chope.co',
    'sevenrooms.com',
    'zenchef.com',
    'formitable.com'
  ];

  function isReservationPlatformUrl(urlStr) {
    try {
      const host = new URL(urlStr).hostname.toLowerCase();
      return RESERVATION_PLATFORM_DOMAINS.some(domain => host === domain || host.endsWith(`.${domain}`));
    } catch {
      return false;
    }
  }

  // Places API 的 reservable 欄位屬於更貴的 Enterprise + Atmosphere SKU，且資料涵蓋率
  // 未知（跟 priceLevel 一樣，很多店家可能查不到），不值得為了這個欄位讓每次搜尋都被
  // 算成更貴的等級。改成只要查得到官網（websiteUri，跟其他既有欄位同一個 SKU 不加價），
  // 就顯示連結讓使用者自己去確認能不能訂位，不在按鈕文字上暗示「這間店一定能訂位」
  function websiteLinkHtml(p, extraAttrs) {
    if (!p.websiteUri) return '';
    const label = isReservationPlatformUrl(p.websiteUri) ? '🍽️ 線上訂位' : '🔗 官方網站';
    return `<a href="${escapeHtml(p.websiteUri)}" target="_blank" rel="noopener noreferrer" ${extraAttrs || ''}>${label}</a>`;
  }

  function formatRouteDistance(meters) {
    if (typeof meters !== 'number') return '';
    // 沒填目的地時是「離起點多遠」，有填目的地時才是「離路線多遠」
    const label = lastDestination ? '距路線' : '距起點';
    return meters >= 1000
      ? `${label} ${(meters / 1000).toFixed(1)} 公里`
      : `${label} ${Math.round(meters)} 公尺`;
  }

  // InfoWindow 的預設氣泡背景是白色，但這個頁面全站文字顏色／清單卡片上的評分橘色、
  // 營業狀態綠/紅色都是特地調給深色底看的淺色，直接原封不動搬進白底彈出框對比會不夠，
  // 所以這裡不重用卡片那份已經上色的 HTML，自己從資料重新組一份深色系的版本
  function buildInfoWindowContent(p, pos) {
    const name = p.displayName?.text || '(未命名)';
    const address = p.formattedAddress || '';
    const ratingText = p.rating
      ? `★ ${p.rating.toFixed(1)}${p.userRatingCount ? ` (${p.userRatingCount})` : ''}`
      : '尚無評分';
    const price = priceText(p);
    const openNow = p.currentOpeningHours?.openNow;
    const openHtml = openNow === true
      ? '<span style="color:#1a7a4c;font-weight:700;">營業中</span>'
      : openNow === false
      ? '<span style="color:#b3261e;font-weight:700;">已打烊</span>'
      : '';
    const routeDistanceText = formatRouteDistance(p._routeDistance);
    const navUrl = buildNavUrl(pos);
    const metaLine = [escapeHtml(ratingText), price, openHtml].filter(Boolean).join(' · ');
    // AI 解析按鈕沒有自己獨立跑一份摘要邏輯，是借用清單卡片既有的 AI 摘要功能：
    // 按下去只負責切回清單、捲到那張卡片，再幫使用者點一下卡片上的「✨ AI 摘要」
    const aiBtnHtml = GEMINI_API_KEY
      ? `<button type="button" class="iw-ai-btn" style="margin-left:10px;border:none;background:none;color:#8a5a1f;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:13px;">✨ AI 解析</button>`
      : '';
    const websiteHtml = websiteLinkHtml(p, 'style="margin-left:10px;color:#8a5a1f;font-weight:700;text-decoration:underline;"');

    return `<div style="color:#1b2140;font-size:13px;line-height:1.6;max-width:220px;">`
      + `<div style="font-weight:700;font-size:14px;margin-bottom:4px;">${escapeHtml(name)}</div>`
      + `<div style="margin-bottom:2px;">${metaLine}</div>`
      + (routeDistanceText ? `<div style="margin-bottom:2px;">📍 ${escapeHtml(routeDistanceText)}</div>` : '')
      + `<div style="color:#5a6180;margin-bottom:6px;">${escapeHtml(address)}</div>`
      + `<div><a href="${navUrl}" target="_blank" rel="noopener noreferrer" style="color:#8a5a1f;font-weight:700;text-decoration:underline;">導航 →</a>${websiteHtml}${aiBtnHtml}</div>`
      + `</div>`;
  }

  // InfoWindow 預設往 marker 正上方彈出，如果 marker 太靠近地圖上緣（搜尋欄、
  // 工具列下方那一小條），彈窗會被裁掉或蓋住其他 UI。這裡先置中，再把視角往上
  // 移一點，讓 marker 落在畫面偏下方，上方多留一些淨空的彈窗空間
  function panForInfoWindow(pos, zoom) {
    map.panTo(pos);
    if (typeof zoom === 'number') map.setZoom(zoom);
    map.panBy(0, -110);
  }

  // 開啟前先收掉前一個開著的 InfoWindow，避免在地圖上切換餐廳時舊的視窗還留著。
  // card 是這間店在清單裡對應的卡片元素，有給的話才會顯示/接上「AI 解析」按鈕
  function openPlaceInfoWindow(p, pos, anchor, card) {
    if (activeInfoWindow) activeInfoWindow.close();
    activeInfoWindow = new google.maps.InfoWindow({
      content: buildInfoWindowContent(p, pos)
    });
    if (card) {
      google.maps.event.addListenerOnce(activeInfoWindow, 'domready', () => {
        const aiBtn = document.querySelector('.iw-ai-btn');
        if (!aiBtn) return;
        aiBtn.addEventListener('click', () => {
          activeInfoWindow.close();
          setMobileView('list');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // 摘要還沒展開才代點一下，已經展開過的話只捲過去就好，不要反而把它點關掉
          const summaryEl = card.querySelector('.ai-summary');
          const toggleBtn = card.querySelector('.ai-summary-toggle');
          if (toggleBtn && (!summaryEl || summaryEl.hidden)) toggleBtn.click();
        });
      });
    }
    activeInfoWindow.open(map, anchor);
  }

  const PRICE_RANK = {
    PRICE_LEVEL_INEXPENSIVE: 1,
    PRICE_LEVEL_MODERATE: 2,
    PRICE_LEVEL_EXPENSIVE: 3,
    PRICE_LEVEL_VERY_EXPENSIVE: 4
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  // 用 Place Details (New) 只抓 reviews 欄位；只在使用者點開單一店家、
  // 或有填「想吃的餐點」需要逐間比對評論時才呼叫，避免每次搜尋都白白多打一堆 API
  async function fetchPlaceReviews(placeId) {
    try {
      const res = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(placeId)}?languageCode=zh-TW`, {
        headers: {
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': 'reviews'
        }
      });
      if (!res.ok) {
        console.warn('取得評論失敗：', res.status, await res.text());
        return null;
      }
      const data = await res.json();
      return data.reviews || [];
    } catch (err) {
      console.warn('取得評論發生錯誤：', err);
      return null;
    }
  }

  function reviewText(review) {
    return (review.text?.text || review.originalText?.text || '').trim();
  }

  // 免 AI 的同義詞擴充：把「想吃的餐點」拆成多個詞，每個詞再對照下面的同義詞群組展開，
  // 只要評論裡出現任何一個展開後的詞就算比對到，緩解使用者打法跟評論用字不一致的問題
  // （例如打「便宜」也能比對到寫「划算」「平價」的評論）。清單不求全，之後真的比對不到再交給 AI。
  const DISH_SYNONYM_GROUPS = [
    ['便宜', '划算', '平價', '俗又大碗', '俗擱大碗', 'cp值高', 'CP值高'],
    ['甜點', '甜食', '甜的', '甜品', '飯後甜點'],
    ['辣', '麻辣', '辣味', '夠辣'],
    ['早餐', '早午餐', 'brunch', 'Brunch'],
    ['消夜', '宵夜'],
    ['約會', '氣氛好', '氛圍佳', '浪漫'],
    ['特別', '特色', '招牌', '必點', '推薦菜'],
    ['清淡', '不辣', '養生'],
    ['份量大', '份量足', '吃得飽', '大碗']
  ];

  function expandDishTokens(rawText) {
    const tokens = rawText.split(/[、,，\/\s]+/).map(t => t.trim()).filter(Boolean);
    const expanded = new Set();
    (tokens.length ? tokens : [rawText.trim()]).filter(Boolean).forEach(tok => {
      expanded.add(tok);
      DISH_SYNONYM_GROUPS.forEach(group => {
        if (group.some(w => tok.includes(w) || w.includes(tok))) {
          group.forEach(w => expanded.add(w));
        }
      });
    });
    return Array.from(expanded);
  }

  function reviewMentionsAny(review, tokens) {
    const text = reviewText(review).toLowerCase();
    return tokens.some(t => text.includes(t.toLowerCase()));
  }

  // 找關鍵字附近的一小段文字當作預覽，找不到就退回開頭那段
  function reviewSnippet(review, keyword) {
    const text = reviewText(review).replace(/\s+/g, ' ');
    if (!text) return '';
    const windowSize = 90;
    const idx = keyword ? text.toLowerCase().indexOf(keyword.toLowerCase()) : -1;
    if (idx === -1) {
      return text.length > windowSize ? text.slice(0, windowSize) + '…' : text;
    }
    const start = Math.max(0, idx - 20);
    const end = Math.min(text.length, idx + keyword.length + 60);
    return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  }

  function renderReviewList(container, reviews) {
    if (!reviews.length) {
      container.innerHTML = '<div class="review-empty">目前沒有評論資料</div>';
      return;
    }
    container.innerHTML = reviews.map(r => {
      const author = escapeHtml(r.authorAttribution?.displayName || '匿名');
      const rating = r.rating ? '★'.repeat(Math.round(r.rating)) : '';
      const time = escapeHtml(r.relativePublishTimeDescription || '');
      const text = escapeHtml(reviewText(r));
      return `
        <div class="review-item">
          <div class="review-meta"><span class="review-author">${author}</span><span class="review-rating">${rating}</span><span class="review-time">${time}</span></div>
          <div class="review-text">${text}</div>
        </div>
      `;
    }).join('');
  }

  // gemma 系列目前不支援 responseSchema 的原生 JSON mode，要它輸出 JSON 只能用文字指令要求，
  // 且回傳常會被包一層 ```json ... ``` code fence，這裡都一併處理掉
  function isGemmaModel(model) {
    return model.startsWith('gemma-');
  }

  function stripJsonCodeFence(text) {
    return text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  }

  async function callGeminiModel(model, prompt, schema) {
    const nativeJsonMode = schema && !isGemmaModel(model);
    const finalPrompt = (schema && !nativeJsonMode)
      ? `${prompt}\n\n請「只」回傳一個符合以下 JSON schema 的物件本身，不要加任何說明文字、也不要用 markdown code fence 包起來：\n${JSON.stringify(schema)}`
      : prompt;
    // gemini-2.5 系列預設會開 thinking，thinking 用掉的 token 跟 maxOutputTokens 是同一個額度，
    // 若沒關掉，300 tokens 常常整包被 thinking 吃光，導致回傳文字被腰斬甚至整段空白，
    // 因此非 gemma 的 model 一律把 thinkingBudget 設 0（gemma 沒有 thinking 參數，設了會出錯）
    const disableThinking = !isGemmaModel(model) ? { thinkingConfig: { thinkingBudget: 0 } } : {};
    const generationConfig = nativeJsonMode
      ? { responseMimeType: 'application/json', responseSchema: schema, ...disableThinking }
      : { maxOutputTokens: 800, ...disableThinking };

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: finalPrompt }] }],
        generationConfig
      })
    });

    if (!res.ok) {
      throw new Error(`[${model}] Gemini API 回傳非 OK：${res.status} ${await res.text()}`);
    }

    const data = await res.json();
    const candidate = data.candidates?.[0];
    const text = candidate?.content?.parts?.[0]?.text;
    if (!text) throw new Error(`[${model}] Gemini 沒有回傳內容（finishReason: ${candidate?.finishReason}）`);
    // finishReason 是 MAX_TOKENS 代表輸出被 maxOutputTokens 腰斬，text 只是半截句子，
    // 不能當成功結果用；丟錯讓 callGemini 換下一個 model 重試，而不是把殘句顯示給使用者看
    if (candidate.finishReason === 'MAX_TOKENS') {
      throw new Error(`[${model}] Gemini 回傳被 maxOutputTokens 截斷（finishReason: MAX_TOKENS）`);
    }
    if (!schema) return text.trim();
    return JSON.parse(nativeJsonMode ? text : stripJsonCodeFence(text));
  }

  // 依 GEMINI_MODEL_CHAIN 的順序依序嘗試；某個 model 失敗（額度用完、暫時性錯誤、
  // 或 gemma 沒把 JSON 格式輸出對）就換下一個，全部都失敗才把最後一個錯誤丟出去給呼叫端。
  async function callGemini(prompt, schema) {
    let lastErr;
    for (const model of GEMINI_MODEL_CHAIN) {
      try {
        return await callGeminiModel(model, prompt, schema);
      } catch (err) {
        console.warn(`Gemini model「${model}」呼叫失敗，換下一個 model：`, err);
        lastErr = err;
      }
    }
    throw lastErr || new Error('沒有可用的 Gemini model');
  }

  // 把一間店的評論丟給 Gemini，生成一段自然語言摘要（整體評價、常被稱讚的菜色、需注意的缺點）
  async function summarizePlaceReviews(placeName, reviews) {
    if (!reviews.length) return '目前沒有評論資料可供摘要。';

    const reviewsText = reviews.slice(0, 10).map((r, i) => {
      const rating = r.rating ? `${r.rating}★` : '無評分';
      return `${i + 1}. [${rating}] ${reviewText(r).slice(0, 300)}`;
    }).join('\n');

    const prompt = `你是美食評論摘要助手。以下是「${placeName}」這間餐廳在 Google 地圖上的顧客評論，請用繁體中文寫一段 100 字以內的摘要，包含：整體評價傾向、常被提到的推薦菜色或特色，以及需要注意的缺點（如果有的話）。直接寫成一段自然的話，不要條列、不要加標題。\n\n評論：\n${reviewsText}`;

    try {
      return await callGemini(prompt);
    } catch (err) {
      console.warn('Gemini 評論摘要失敗：', err);
      return null;
    }
  }

  // 免 AI、每次搜尋都會自動跑一遍的關鍵字清理：用固定的規則把常見的口語篩選詞
  // （現在有開、便宜等）從關鍵字裡挑出來變成篩選條件，剩下的文字才拿去做地圖文字搜尋，
  // 避免這些字混在 textQuery 裡稀釋掉真正的料理名稱/店名關鍵字。跟 parseKeywordWithGemini
  // 回傳同一種格式，方便共用下游邏輯；規則涵蓋不到的說法（更抽象的口語）才會交給 AI 解析。
  const KEYWORD_FILTER_PATTERNS = [
    { re: /(現在|目前)?(營業中|還在營業|有開著|還有開|有開|開著)/g, flag: 'openNow' },
    { re: /(便宜|划算|平價|俗又大碗|俗擱大碗|cp值高)/gi, flag: 'preferCheap' }
  ];

  function localParseKeyword(rawText) {
    let keyword = rawText;
    let openNow = false;
    let preferCheap = false;
    KEYWORD_FILTER_PATTERNS.forEach(({ re, flag }) => {
      if (re.test(keyword)) {
        if (flag === 'openNow') openNow = true;
        if (flag === 'preferCheap') preferCheap = true;
        keyword = keyword.replace(re, '');
      }
    });
    keyword = keyword.replace(/[，,、]+/g, ' ').replace(/\s+/g, ' ').trim();
    return { keyword, openNow, preferCheap };
  }

  // 把使用者在關鍵字欄位打的口語文字，解析成搜尋關鍵字 + 是否只看營業中 + 是否偏好便宜
  async function parseKeywordWithGemini(rawText) {
    const prompt = `你是餐廳搜尋助手。使用者在「關鍵字」欄位輸入了以下文字，裡面可能包含料理名稱、店名，也可能夾雜口語化的篩選需求（例如想要便宜、想要現在還有營業）。請解析成三個欄位：
1. keyword：純粹用來做地圖文字搜尋的關鍵字（料理名稱、店名或菜色，去掉篩選類的敘述）；如果整句都只是篩選需求、沒有指定料理或店名，回傳空字串。
2. openNow：使用者是否表達想要「現在營業中／還有開」的意思，true 或 false。
3. preferCheap：使用者是否表達想要「便宜／划算／平價」的意思，true 或 false。

原始輸入：「${rawText}」`;

    return callGemini(prompt, {
      type: 'OBJECT',
      properties: {
        keyword: { type: 'STRING' },
        openNow: { type: 'BOOLEAN' },
        preferCheap: { type: 'BOOLEAN' }
      },
      required: ['keyword', 'openNow', 'preferCheap']
    });
  }

  // 「想吃的餐點」的 AI 備援：只有在同義詞擴充比對完全找不到符合的店家時才會呼叫，
  // 一次把所有候選店家的評論摘錄丟給 Gemini 做語意判斷（而不是每間店各呼叫一次），
  // 藉此在不大量增加 API 用量的前提下，也能應付「氣氛好」「約會」這類同義詞庫涵蓋不到的模糊描述
  async function semanticMatchDishKeyword(dishKeyword, candidates) {
    const entries = candidates.map((c, i) => {
      const snippets = (c._reviews || [])
        .slice(0, 5)
        .map(r => reviewText(r).slice(0, 150))
        .filter(Boolean)
        .join(' / ');
      return `${i}. ${c.displayName?.text || '(未命名)'}：${snippets || '（無評論內容）'}`;
    }).join('\n');

    const prompt = `你是餐廳評論比對助手。使用者想找「${dishKeyword}」，可能是具體菜色，也可能是氣氛、價位、場合等比較抽象的描述。以下是候選餐廳的編號、店名跟幾則評論摘錄，請判斷哪些餐廳的評論內容顯示這間店符合使用者想找的東西（不需要逐字比對，語意相符即可），回傳符合的餐廳編號陣列（從 0 開始）；都不符合就回傳空陣列。\n\n${entries}`;

    return callGemini(prompt, {
      type: 'OBJECT',
      properties: {
        matchedIndexes: { type: 'ARRAY', items: { type: 'INTEGER' } }
      },
      required: ['matchedIndexes']
    });
  }

  if (!GEMINI_API_KEY) {
    keywordParseBtn.hidden = true;
  } else {
    keywordParseBtn.addEventListener('click', async () => {
      const raw = keywordInput.value.trim();
      if (!raw) {
        setStatus('請先在關鍵字欄位輸入內容再解析', 'error');
        return;
      }
      keywordParseBtn.disabled = true;
      keywordParseBtn.textContent = '解析中…';
      try {
        const parsed = await parseKeywordWithGemini(raw);
        keywordInput.value = parsed.keyword || '';
        if (parsed.openNow) openNowOnlyEl.checked = true;
        if (parsed.preferCheap) sortSelectEl.value = 'price';
        applyFiltersAndRender();

        const notes = [parsed.keyword ? `關鍵字＝「${parsed.keyword}」` : '未指定關鍵字'];
        if (parsed.openNow) notes.push('只顯示營業中');
        if (parsed.preferCheap) notes.push('依價格排序');
        setStatus(`已用 AI 解析：${notes.join('、')}`, 'ok');
      } catch (err) {
        console.warn('Gemini 關鍵字解析失敗：', err);
        setStatus('AI 解析失敗，請直接手動輸入關鍵字', 'error');
      } finally {
        keywordParseBtn.disabled = false;
        keywordParseBtn.textContent = '✨ AI 解析';
      }
    });
  }

  function applyFiltersAndRender() {
    if (!lastResults.length) return;

    const targetCount = parseInt(targetCountInput.value, 10) || 10;
    let list = lastResults.slice();

    if (openNowOnlyEl.checked) {
      list = list.filter(p => p.currentOpeningHours?.openNow === true);
    }

    if (sortSelectEl.value === 'price') {
      list.sort((a, b) => (PRICE_RANK[a.priceLevel] || 99) - (PRICE_RANK[b.priceLevel] || 99));
    } else if (sortSelectEl.value === 'rating') {
      list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    } else {
      // 順路優先：先比真正垂直於路線的距離（越小代表越不用繞路），
      // 距離相近時再依沿路線方向的累積進度排序，讓清單順序盡量跟著行進方向走，不會忽前忽後
      list.sort((a, b) => {
        const da = a._routeDistance ?? Infinity;
        const db = b._routeDistance ?? Infinity;
        if (Math.abs(da - db) > 30) return da - db;
        return (a._routeProgress ?? Infinity) - (b._routeProgress ?? Infinity);
      });
    }

    renderResults(list.slice(0, targetCount));
  }

  sortSelectEl.addEventListener('change', applyFiltersAndRender);
  openNowOnlyEl.addEventListener('change', applyFiltersAndRender);
  targetCountInput.addEventListener('change', applyFiltersAndRender);

  function renderResults(places) {
    resultCountEl.textContent = `找到 ${places.length} 間餐廳`;
    resultListEl.innerHTML = '';
    clearPlaceMarkers();

    places.forEach((p, i) => {
      const pos = { lat: p.location.latitude, lng: p.location.longitude };
      const name = p.displayName?.text || '(未命名)';
      const address = p.formattedAddress || '';

      const marker = new google.maps.Marker({
        position: pos,
        title: name,
        icon: markerIcon(false),
        label: markerLabel(i),
        zIndex: 10
      });
      placeMarkers.push(marker);

      const card = document.createElement('div');
      card.className = 'place-card';
      card.style.animationDelay = `${Math.min(i, 12) * 25}ms`;
      const rating = p.rating
        ? `★ ${p.rating.toFixed(1)}${p.userRatingCount ? ` (${p.userRatingCount})` : ''}`
        : '尚無評分';
      const price = priceText(p);
      const openNow = p.currentOpeningHours?.openNow;
      const openStatus = openNow === true
        ? '<span class="open-badge open">營業中</span>'
        : openNow === false
        ? '<span class="open-badge closed">已打烊</span>'
        : '';
      const navUrl = buildNavUrl(pos);
      const routeDistanceText = formatRouteDistance(p._routeDistance);
      const matchedSnippet = p._matchedReview ? reviewSnippet(p._matchedReview, p._matchedKeyword || '') : '';
      const matchNote = matchedSnippet
        ? `💬 評論提到：「${escapeHtml(matchedSnippet)}」`
        : (p._aiMatched ? `✨ AI 判斷這裡符合「${escapeHtml(p._matchedKeyword || '')}」` : '');
      const reviewCountLabel = p._reviews ? ` (${p._reviews.length})` : '';
      card.innerHTML = `
        <div class="name"><span class="place-index">${i + 1}</span>${escapeHtml(name)}</div>
        <div class="meta">
          ${routeDistanceText ? `<span class="route-distance">${routeDistanceText}</span>` : ''}
          <span class="rating">${rating}</span>
          <span>${escapeHtml(address)}</span>
          ${price ? `<span>${price}</span>` : ''}
          ${openStatus}
        </div>
        ${matchNote ? `<div class="review-match">${matchNote}</div>` : ''}
        <a class="nav-link" href="${navUrl}" target="_blank" rel="noopener noreferrer" title="在 Google Maps 開啟含原本起點/終點的完整路線">導航 →</a>
        ${websiteLinkHtml(p, 'class="website-link" title="前往店家官網"')}
        <div class="card-actions">
          <button type="button" class="review-toggle">查看評論${reviewCountLabel}</button>
          ${GEMINI_API_KEY ? '<button type="button" class="review-toggle ai-summary-toggle">✨ AI 摘要</button>' : ''}
        </div>
        <div class="eaten-widget-slot"></div>
        <div class="ai-summary" hidden></div>
        <div class="review-list" hidden></div>
      `;
      card.addEventListener('click', () => {
        panForInfoWindow(pos, PLACE_INFO_ZOOM);
        openPlaceInfoWindow(p, pos, marker, card);
      });
      card.querySelector('.nav-link').addEventListener('click', (e) => e.stopPropagation());
      card.querySelector('.website-link')?.addEventListener('click', (e) => e.stopPropagation());

      // 清單卡片 ↔ 地圖標記雙向連動：滑過任一邊，另一邊會一起亮起來
      card.addEventListener('mouseenter', () => setPlaceHighlighted(i, true));
      card.addEventListener('mouseleave', () => setPlaceHighlighted(i, false));
      marker.addListener('mouseover', () => setPlaceHighlighted(i, true));
      marker.addListener('mouseout', () => setPlaceHighlighted(i, false));
      marker.addListener('click', () => {
        panForInfoWindow(pos, PLACE_INFO_ZOOM);
        openPlaceInfoWindow(p, pos, marker, card);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      wireEatenWidget(card.querySelector('.eaten-widget-slot'), p.id, name);

      wireReviewAndAiActions(card, p, name);

      placeCards.push(card);
      resultListEl.appendChild(card);
    });

    // 結果多、店家又密集時，個別 marker 會擠成一團互相蓋住；用 clusterer 讓縮小時
    // 自動收成一顆數字圓點，放大到能分辨個別店家的 zoom 才拆開顯示。
    // maxZoom 設在 PLACE_INFO_ZOOM 之下，確保點開 InfoWindow 時一定強制 zoom 到
    // 不會被 cluster 隱藏的層級，兩個 marker 相關的功能才不會互相打架
    if (placeMarkers.length) {
      placeMarkerCluster = new MarkerClusterer({
        map,
        markers: placeMarkers,
        algorithm: new SuperClusterAlgorithm({ maxZoom: CLUSTER_MAX_ZOOM })
      });
    }
  }

  // 「查看評論」＋「✨ AI 摘要」按鈕的共用綁定邏輯，讓一般搜尋結果卡片跟「踩新點」隨機推薦卡片
  // 都能查看評論、生成 AI 摘要，行為完全一致
  function wireReviewAndAiActions(container, p, name) {
    // 用 :not(.ai-summary-toggle) 明確排除 AI 摘要按鈕，不依賴兩個按鈕在 DOM 裡的先後順序
    const reviewToggleBtn = container.querySelector('.review-toggle:not(.ai-summary-toggle)');
    const reviewListEl = container.querySelector('.review-list');
    reviewToggleBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!reviewListEl.hidden) {
        reviewListEl.hidden = true;
        return;
      }
      if (!p._reviews) {
        reviewToggleBtn.textContent = '載入評論中…';
        reviewToggleBtn.disabled = true;
        const reviews = await fetchPlaceReviews(p.id);
        reviewToggleBtn.disabled = false;
        // fetchPlaceReviews 失敗時回傳 null；不快取失敗結果，讓使用者下次點擊可以重試，
        // 而不是被永遠卡在「暫時性錯誤」造成的空清單
        if (reviews === null) {
          reviewListEl.innerHTML = '<div class="review-empty">評論載入失敗，請稍後再試</div>';
          reviewListEl.hidden = false;
          reviewToggleBtn.textContent = '查看評論';
          return;
        }
        p._reviews = reviews;
      }
      renderReviewList(reviewListEl, p._reviews);
      reviewListEl.hidden = false;
      reviewToggleBtn.textContent = `查看評論 (${p._reviews.length})`;
    });

    const aiSummaryBtn = container.querySelector('.ai-summary-toggle');
    const aiSummaryEl = container.querySelector('.ai-summary');
    if (aiSummaryBtn) {
      aiSummaryBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!aiSummaryEl.hidden) {
          aiSummaryEl.hidden = true;
          return;
        }
        if (!p._aiSummary) {
          aiSummaryBtn.textContent = '摘要生成中…';
          aiSummaryBtn.disabled = true;
          if (!p._reviews) {
            const reviews = await fetchPlaceReviews(p.id);
            if (reviews !== null) p._reviews = reviews;
          }
          const summary = await summarizePlaceReviews(name, p._reviews || []);
          aiSummaryBtn.disabled = false;
          aiSummaryBtn.textContent = '✨ AI 摘要';
          // summarizePlaceReviews 失敗時回傳 null；同樣不快取，讓下次點擊可以重新生成
          if (summary === null) {
            aiSummaryEl.textContent = 'AI 摘要暫時無法使用，請稍後再試。';
            aiSummaryEl.hidden = false;
            return;
          }
          p._aiSummary = summary;
        }
        aiSummaryEl.textContent = p._aiSummary;
        aiSummaryEl.hidden = false;
      });
    }
  }

  let discoverMarker = null;
  let lastDiscoverPickId = null;

  function clearDiscoverMarker() {
    if (discoverMarker) {
      discoverMarker.setMap(null);
      discoverMarker = null;
    }
  }

  // 從目前搜尋結果（已依關鍵字/半徑等條件過濾）中隨機挑一間，可選是否排除已標記「吃過」的店家
  function renderDiscoverResult(p) {
    const pos = { lat: p.location.latitude, lng: p.location.longitude };
    const name = p.displayName?.text || '(未命名)';
    const address = p.formattedAddress || '';
    const rating = p.rating
      ? `★ ${p.rating.toFixed(1)}${p.userRatingCount ? ` (${p.userRatingCount})` : ''}`
      : '尚無評分';
    const price = priceText(p);
    const openNow = p.currentOpeningHours?.openNow;
    const openStatus = openNow === true
      ? '<span class="open-badge open">營業中</span>'
      : openNow === false
      ? '<span class="open-badge closed">已打烊</span>'
      : '';
    const routeDistanceText = formatRouteDistance(p._routeDistance);
    const navUrl = buildNavUrl(pos);
    const reviewCountLabel = p._reviews ? ` (${p._reviews.length})` : '';

    discoverResultEl.innerHTML = `
      <div class="place-card discover-card">
        <div class="name">🎯 ${escapeHtml(name)}</div>
        <div class="meta">
          ${routeDistanceText ? `<span class="route-distance">${routeDistanceText}</span>` : ''}
          <span class="rating">${rating}</span>
          <span>${escapeHtml(address)}</span>
          ${price ? `<span>${price}</span>` : ''}
          ${openStatus}
        </div>
        <a class="nav-link" href="${navUrl}" target="_blank" rel="noopener noreferrer" title="在 Google Maps 開啟含原本起點/終點的完整路線">導航 →</a>
        ${websiteLinkHtml(p, 'class="website-link" title="前往店家官網"')}
        <div class="card-actions">
          <button type="button" class="review-toggle">查看評論${reviewCountLabel}</button>
          ${GEMINI_API_KEY ? '<button type="button" class="review-toggle ai-summary-toggle">✨ AI 摘要</button>' : ''}
        </div>
        <div class="eaten-widget-slot"></div>
        <div class="ai-summary" hidden></div>
        <div class="review-list" hidden></div>
      </div>
    `;

    wireEatenWidget(discoverResultEl.querySelector('.eaten-widget-slot'), p.id, name);
    wireReviewAndAiActions(discoverResultEl, p, name);

    clearDiscoverMarker();
    discoverMarker = new google.maps.Marker({
      position: pos,
      map,
      title: name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9,
        fillColor: '#6fbf8b',
        fillOpacity: 1,
        strokeColor: '#12172b',
        strokeWeight: 2
      },
      zIndex: 999
    });
    panForInfoWindow(pos, 16);
    openPlaceInfoWindow(p, pos, discoverMarker, discoverResultEl);
  }

  discoverBtn.addEventListener('click', () => {
    if (!lastResults.length) return;

    discoverBtn.classList.remove('rolling');
    void discoverBtn.offsetWidth;
    discoverBtn.classList.add('rolling');
    setTimeout(() => discoverBtn.classList.remove('rolling'), 500);

    let candidates = lastResults.slice();
    if (openNowOnlyEl.checked) {
      candidates = candidates.filter(p => p.currentOpeningHours?.openNow === true);
    }

    // 避免連續兩次抽到同一間；但如果排除後就沒候選了（篩到只剩它自己），就不排除
    if (lastDiscoverPickId && candidates.some(p => p.id !== lastDiscoverPickId)) {
      candidates = candidates.filter(p => p.id !== lastDiscoverPickId);
    }

    const poolNew = candidates.filter(p => !isEaten(p.id));
    const poolOld = candidates.filter(p => isEaten(p.id) && eatenRating(p.id) >= EATEN_GOOD_RATING_THRESHOLD);

    // 先用固定比例（OLD_FAVORITE_RATIO）決定這次要從舊愛池還是新店池抽，
    // 池子裡沒東西時 fallback 到另一個池子，兩個都沒東西才算沒結果
    let picked = null;
    if (includeEatenCheckbox.checked && poolOld.length && (!poolNew.length || Math.random() < OLD_FAVORITE_RATIO)) {
      picked = weightedRandomPick(poolOld);
    } else if (poolNew.length) {
      picked = weightedRandomPick(poolNew);
    } else if (includeEatenCheckbox.checked) {
      picked = weightedRandomPick(poolOld);
    }

    if (!picked) {
      clearDiscoverMarker();
      discoverResultEl.innerHTML = '<div class="discover-result-empty">目前條件下沒有符合的餐廳可以推薦，試試勾選「包含吃過的高評價餐廳」。</div>';
      return;
    }

    lastDiscoverPickId = picked.id;
    renderDiscoverResult(picked);
  });

  async function searchAlongRoute(routeIndex, keywordOverride) {
    const radius = parseInt(radiusInput.value, 10) || 1200;
    // keywordOverride 只有在「關鍵字搜不到結果、AI 重新解析後自動重試」時才會帶入（見下方零結果備援），
    // 用 typeof 判斷而不是單純看真假值，這樣才能區分「沒有帶」跟「AI 解析出空字串」兩種狀況
    const isFallbackRetry = typeof keywordOverride === 'string';
    const rawKeyword = isFallbackRetry ? keywordOverride : keywordInput.value.trim();
    const localParsed = localParseKeyword(rawKeyword);
    const keyword = localParsed.keyword;
    if (!isFallbackRetry) {
      // 只在使用者這次真正送出的關鍵字上套用偵測到的篩選條件，AI 備援重試時不重複套用，
      // 避免使用者手動取消勾選後，重試又把它勾回去
      if (localParsed.openNow) openNowOnlyEl.checked = true;
      if (localParsed.preferCheap) sortSelectEl.value = 'price';
    }

    searchBtn.disabled = true;
    searchBtn.classList.add('is-loading');

    // 沒填目的地時 allRoutes 會是空陣列，改成只用起點附近那一個點來搜尋，不用沿路取樣
    const hasRoute = allRoutes.length > 0;
    sortDistanceOptionEl.textContent = hasRoute ? '順路優先' : '離起點最近';

    try {
      const samplePoints = hasRoute
        ? samplePointsAlongPath(allRoutes[routeIndex].overview_path, SAMPLE_INTERVAL_KM)
        : [lastOriginLocation];

      setStatus(hasRoute ? `路線取得完成，沿路 ${samplePoints.length} 個點搜尋中…` : '搜尋起點附近中…');

      const allResultsMap = new Map();
      for (let i = 0; i < samplePoints.length; i++) {
        if (hasRoute) setStatus(`搜尋中… (${i + 1}/${samplePoints.length})`);
        const places = await nearbySearch(samplePoints[i], radius, keyword);
        places.forEach(p => {
          if (!p.id || !p.location) return;
          // 同一間店可能被多個取樣點找到，去重即可，實際「順路距離」在下面統一用完整路線重新計算
          if (!allResultsMap.has(p.id)) allResultsMap.set(p.id, p);
        });
        // 避免過快連續打 API
        await new Promise(r => setTimeout(r, 150));
      }

      lastResults = Array.from(allResultsMap.values());

      if (hasRoute) {
        // 用完整、有方向性的逐步路徑（而不是粗略的取樣點）算出每間店「真正垂直於路線的距離」，
        // 以及沿路線方向的累積進度，避免把對向車道、反方向路段或平行道路上的店誤判成順路
        const detailedPath = buildDetailedRoutePath(allRoutes[routeIndex]);
        lastResults.forEach(p => {
          const placeLatLng = new google.maps.LatLng(p.location.latitude, p.location.longitude);
          const proj = projectPointOntoRoutePath(placeLatLng, detailedPath);
          p._routeDistance = proj.distance;
          p._routeProgress = proj.progress;
        });
      } else {
        // 沒有路線可比對，改成算「離起點多遠」，_routeProgress 全部一樣，排序就單純依距離
        lastResults.forEach(p => {
          const placeLatLng = new google.maps.LatLng(p.location.latitude, p.location.longitude);
          p._routeDistance = google.maps.geometry.spherical.computeDistanceBetween(lastOriginLocation, placeLatLng);
          p._routeProgress = 0;
        });
      }

      // 關鍵字搜尋零結果備援：如果打了關鍵字卻完全沒找到餐廳，可能是打得太口語/模糊，
      // 讓 Google 文字搜尋字面比對失敗。只在「第一次搜尋、還沒重試過」時觸發一次 AI 重新解析，
      // 避免使用者手動取消掉的篩選條件被反覆蓋回去，也避免無限重試
      if (!isFallbackRetry && keyword && lastResults.length === 0 && GEMINI_API_KEY) {
        setStatus(`沒有找到符合「${rawKeyword}」的餐廳，嘗試用 AI 重新解析關鍵字…`);
        try {
          const aiParsed = await parseKeywordWithGemini(rawKeyword);
          const aiKeyword = (aiParsed.keyword || '').trim();
          if (aiKeyword && aiKeyword !== keyword) {
            if (aiParsed.openNow) openNowOnlyEl.checked = true;
            if (aiParsed.preferCheap) sortSelectEl.value = 'price';
            return await searchAlongRoute(routeIndex, aiKeyword);
          }
        } catch (err) {
          console.warn('AI 關鍵字備援解析失敗：', err);
        }
      }

      const dishKeyword = dishKeywordInput.value.trim();
      let cappedCandidateCount = 0;
      let dishAiMatchedCount = 0;
      if (dishKeyword) {
        // 依順路距離排序後只取前 MAX_REVIEW_CANDIDATES 間去查評論，
        // 避免路線很長、候選店家很多時打爆 Place Details 配額
        const candidates = lastResults
          .slice()
          .sort((a, b) => (a._routeDistance ?? Infinity) - (b._routeDistance ?? Infinity))
          .slice(0, MAX_REVIEW_CANDIDATES);
        cappedCandidateCount = candidates.length;

        const dishTokens = expandDishTokens(dishKeyword);
        const matched = [];
        for (let i = 0; i < candidates.length; i++) {
          setStatus(`比對評論中…(${i + 1}/${candidates.length})`);
          const place = candidates[i];
          const reviews = await fetchPlaceReviews(place.id);
          if (reviews !== null) place._reviews = reviews;
          const hit = (reviews || []).find(r => reviewMentionsAny(r, dishTokens));
          if (hit) {
            place._matchedReview = hit;
            place._matchedKeyword = dishKeyword;
            matched.push(place);
          }
          await new Promise(r => setTimeout(r, 120));
        }

        // 同義詞擴充比對不到任何一間時才啟用 AI 語意比對，一次把所有候選店家的評論
        // 摘錄送給 Gemini 判斷，涵蓋「氣氛好」「約會」這類同義詞庫沒收錄的抽象描述
        if (!matched.length && candidates.length && GEMINI_API_KEY) {
          setStatus(`本機比對沒有找到符合「${dishKeyword}」的餐廳，改用 AI 語意比對中…`);
          try {
            const { matchedIndexes } = await semanticMatchDishKeyword(dishKeyword, candidates);
            (matchedIndexes || []).forEach(idx => {
              const place = candidates[idx];
              if (place && !matched.includes(place)) {
                place._matchedKeyword = dishKeyword;
                place._aiMatched = true;
                matched.push(place);
                dishAiMatchedCount++;
              }
            });
          } catch (err) {
            console.warn('AI 語意比對失敗：', err);
          }
        }

        lastResults = matched;
      }

      resultsControlsEl.hidden = lastResults.length === 0;
      discoverBoxEl.hidden = lastResults.length === 0;
      clearDiscoverMarker();
      discoverResultEl.innerHTML = '';
      lastDiscoverPickId = null;
      applyFiltersAndRender();
      if (dishKeyword) {
        const aiNote = dishAiMatchedCount ? `（其中 ${dishAiMatchedCount} 間是透過 AI 語意比對找到）` : '';
        setStatus(`完成！在 ${cappedCandidateCount} 間候選餐廳中比對評論後，找到 ${lastResults.length} 間符合「${dishKeyword}」的餐廳${aiNote}。`, 'ok');
      } else {
        setStatus(hasRoute
          ? `完成！沿路共找到 ${lastResults.length} 間不重複的餐廳。`
          : `完成！起點附近共找到 ${lastResults.length} 間不重複的餐廳。`, 'ok');
      }
    } catch (err) {
      console.error(err);
      setStatus(err.message || '發生錯誤，請檢查網路連線', 'error');
    } finally {
      searchBtn.disabled = false;
      searchBtn.classList.remove('is-loading');
    }
  }

  async function runSearch() {
    const origin = originInput.value.trim();
    const destination = destinationInput.value.trim();

    if (!GOOGLE_MAPS_API_KEY) return setStatus('尚未設定 Google Maps API Key，請在 .env 中設定 VITE_GOOGLE_MAPS_API_KEY 後重新啟動 npm run dev', 'error');
    if (!origin) return setStatus('請輸入起點', 'error');

    lastOrigin = origin;
    lastDestination = destination;
    saveSearch();

    searchBtn.disabled = true;
    searchBtn.classList.add('is-loading');
    routeOptionsEl.hidden = true;
    setStatus('載入地圖服務中…');

    try {
      await loadGoogleMapsSDK();
      initMapIfNeeded();

      if (destination) {
        directionsRenderer.setMap(map);
        setStatus('規劃路線中…');
        const result = await new Promise((resolve, reject) => {
          directionsService.route(
            { origin, destination, travelMode: google.maps.TravelMode.DRIVING, provideRouteAlternatives: true },
            (res, status) => {
              if (status === google.maps.DirectionsStatus.OK) resolve(res);
              else reject(new Error('路線規劃失敗：' + status));
            }
          );
        });

        allRoutes = result.routes;
        selectedRouteIndex = 0;
        lastOriginLocation = null;
        directionsRenderer.setDirections(result);
        directionsRenderer.setRouteIndex(0);
        renderRouteOptions();
      } else {
        // 沒填目的地：只找起點附近，不需要路線，先把上一次搜尋留下的路線畫面清掉
        allRoutes = [];
        selectedRouteIndex = 0;
        directionsRenderer.setMap(null);
        setStatus('定位起點中…');
        lastOriginLocation = await resolveLocationText(origin);
        map.setCenter(lastOriginLocation);
        map.setZoom(15);
      }

      await searchAlongRoute(0);
    } catch (err) {
      console.error(err);
      setStatus(err.message || '發生錯誤，請檢查 API key 與網路連線', 'error');
      searchBtn.disabled = false;
      searchBtn.classList.remove('is-loading');
    }
  }

  searchBtn.addEventListener('click', runSearch);
</script>
